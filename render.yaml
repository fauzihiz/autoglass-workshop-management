services:
  - type: web
    name: workshop-management
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    # Note: Supabase DB credentials are set manually in Render dashboard
    # Environment tab because they're external to Render.
    envVars:
      - key: APP_NAME
        value: "Workshop Management System"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: ""  # Set after first deploy (e.g., https://workshop-management.onrender.com)
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_FAKER_LOCALE
        value: en_US
      - key: APP_MAINTENANCE_DRIVER
        value: file
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_STACK
        value: single
      - key: LOG_DEPRECATIONS_CHANNEL
        value: "null"
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_PORT
        value: "6543"
      - key: DB_DATABASE
        value: "postgres"
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_ENCRYPT
        value: "false"
      - key: SESSION_PATH
        value: /
      - key: SESSION_DOMAIN
        value: "null"
      - key: FILESYSTEM_DISK
        value: local
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      # ⚠️ You MUST also set these manually in Render dashboard:
      #   DB_HOST     = aws-0-ap-southeast-1.pooler.supabase.com
      #   DB_USERNAME = postgres.<your-project-ref>
      #   DB_PASSWORD = <your-supabase-password>

